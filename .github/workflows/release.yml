name: Release Build

# Baut die Release-Artefakte auf nativen Runnern, weil PyInstaller NICHT
# cross-compilen kann:
#   - macOS-Runner  (arm64)  -> Python-Sidecar (Mach-O) + DMG
#   - Windows-Runner (x64)   -> Python-Sidecar (.exe)   + NSIS-Installer
#
# Trigger: manueller Dispatch oder ein Tag v*.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # macOS (Apple Silicon) — DMG
  # =========================================================================
  build-mac:
    runs-on: macos-14   # arm64 Runner
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build release (Mac DMG + Sidecar)
        run: npm run build:release:mac

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: billsorter-mac-arm64
          path: app/release/**/*.dmg
          if-no-files-found: error

  # =========================================================================
  # Windows (x64) — NSIS-Installer
  # =========================================================================
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # build-release.sh braucht bash (auf Windows-Runnern via Git-Bash vorhanden)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build release (Windows EXE + Sidecar)
        run: npm run build:release:win

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: billsorter-win-x64
          path: app/release/**/*.exe
          if-no-files-found: error

  # =========================================================================
  # Optional: Artefakte an ein GitHub-Release hängen (nur bei Tag-Push)
  # =========================================================================
  publish:
    needs: [build-mac, build-win]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-artifacts/**/*.dmg
            dist-artifacts/**/*.exe
