[project]
name = "billsorter-sidecar"
version = "0.1.0"
description = "BillSorter Python Sidecar — IMAP-Scanner + Claude-Haiku-Classifier"
requires-python = ">=3.9,<3.13"
authors = [{ name = "ARGAVIS" }]
license = { text = "Proprietary" }

dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.3",
  "httpx==0.28.1",
  "anyio==4.7.0",
  "websockets==14.1",
  "python-multipart==0.0.20",
  "eval_type_backport==0.2.0; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
  "ruff==0.8.4",
  "pyinstaller==6.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "api", "lib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "A", "C4", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"build/*" = ["S"]
